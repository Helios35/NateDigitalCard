<style>
  /* ==================================================================
     THE CARD'S TOKENS: the one place a value is written (Unit 03 standard).
     Every colour, radius, shadow, font, type size and motion time the card
     uses is declared here, once, under fin's name where fin has one.
     Rules below read var() only. The two exceptions, each commented where
     it is used: black transparencies for an overlay or a shadow, and the
     keywords transparent / currentColor (no colour of their own).
     ================================================================== */
  :root {
    color-scheme: dark;

    /* Colour: fin's dark set (zen-linen-fin.css, .dark). These are the card's only colours. */
    --sidebar: #101010;            /* fin's darkest step: the page behind the card (theme-color mirrors it) */
    --background: #141414;         /* the card itself, and the QR sheet */
    --foreground: #E8E3DA;         /* linen */
    --card: #1C1C1C;               /* surfaces on the card: link rows, flip panel, toast */
    --primary: #D1CFC0;            /* stone */
    --primary-foreground: #363636;
    --secondary: #222222;
    --muted: #2A2A2A;
    --muted-foreground: #8E8A83;
    --accent: #363636;
    --border: #2C2C2C;
    --input: #2C2C2C;              /* the outline button's border (fin's dark:border-input) */
    --ring: #D1CFC0;
    --brand: #F26A4B;              /* coral: the one accent */

    /* Fin's opacity steps (Tailwind's token/NN): each is its base token above at that alpha.
       Written out as rgb() so they paint on every browser. Change one with its base. */
    --input-30: rgb(44 44 44 / 0.3);        /* --input /30: outline button at rest */
    --input-50: rgb(44 44 44 / 0.5);        /* --input /50: outline button, hover */
    --accent-50: rgb(54 54 54 / 0.5);       /* --accent /50: ghost button, hover */
    --primary-90: rgb(209 207 192 / 0.9);   /* --primary /90: primary button, hover */
    --primary-80: rgb(209 207 192 / 0.8);   /* --primary /80: primary button, pressed */
    --background-0: rgb(20 20 20 / 0);      /* --background /0, /60, /90: the hero shade, */
    --background-60: rgb(20 20 20 / 0.6);   /* where the clip fades into the card under the name */
    --background-90: rgb(20 20 20 / 0.9);

    /* Radius: fin's scale, every step derived from one --radius (app/globals.css). */
    --radius: 0.5rem;
    --radius-md: calc(var(--radius) * 0.8);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) * 1.4);
    --radius-full: 999px;          /* fin's rounded-full (a pill): the one step not derived, as in fin */

    /* Shadow: fin's soft scale. Near-invisible in dark on purpose: the border separates. */
    --shadow-xs: 0 1px 4px 1px rgb(0 0 0 / 0.04);
    --shadow-lg: 0 8px 30px 5px rgb(0 0 0 / 0.06);
    --shadow-xl: 0 14px 44px 7px rgb(0 0 0 / 0.07);

    /* Type: fin's three families (zen-linen-fin.css names), then the size steps. Fin's theme
       sets no size scale (UX_SPEC §1): these are its token layer's steps (Tailwind's text-*
       and fin's own --text-eyebrow) plus the card's two display sizes. */
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --text-eyebrow: 11px;          /* fin's one sub-12px step: every mono label, the footer line */
    --text-xs: 12px;
    --text-sm: 14px;
    --text-base: 16px;
    --text-2xl: 24px;
    --text-display-sm: 27px;       /* the flip-side line */
    --text-display: 38px;          /* the name */

    /* Motion. Every state change runs --duration-fast (fin §8: under 200ms). The flip, the
       entrance and the poster-to-video fade keep Unit 01's timing, exempt from that ceiling. */
    --duration-fast: 150ms;
    --duration-flip: 0.7s;
    --duration-entrance: 0.6s;
    --duration-fade: 0.4s;
    --delay-face-swap: 0.09s;      /* the faces swap visibility at the flip's edge-on point */
    --ease-flip: cubic-bezier(.22, 1, .36, 1);
    --ease-entrance: cubic-bezier(.2, .7, .2, 1);
  }

  @font-face {
    font-family: "Inter";
    src: url("fonts/inter.woff2") format("woff2");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Playfair Display";
    src: url("fonts/playfair-display.woff2") format("woff2");
    font-weight: 400 900; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/jetbrains-mono.woff2") format("woff2");
    font-weight: 100 800; font-style: normal; font-display: swap;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html.is-locked { overflow: hidden; }
  body {
    min-height: 100svh;
    background: var(--sidebar);
    color: var(--foreground);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; }
  p { margin: 0; }

  /* Entrance (Unit 01 timing). Fills backwards only, so once it ends it lets go
     of opacity and a component's own states (disabled) apply again. */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .reveal { animation: rise var(--duration-entrance) var(--ease-entrance) backwards; }

  main { min-height: 100svh; display: flex; justify-content: center; padding: 24px 18px 40px; }

  .card {
    width: 100%; max-width: 420px; align-self: center; position: relative;
    border-radius: var(--radius-xl); border: 1px solid var(--border); overflow: hidden;
    background: var(--background); box-shadow: var(--shadow-xl);
  }

  /* ---------- interaction: fin's INTERACTIVE base, on every control ---------- */
  .btn, .link, .quick a {
    cursor: pointer; outline: none; touch-action: manipulation;
    transition: color var(--duration-fast), background-color var(--duration-fast), border-color var(--duration-fast), opacity var(--duration-fast);
  }

  /* ---------- Button: button.tsx. Every button carries .btn plus one variant class:
       .save = default (primary) · .icon-btn = outline, icon size · .flip-hint = ghost
       · .qr-close = dialog.tsx close. States live in the state blocks further down. ---------- */
  .btn { border-radius: var(--radius-md); }
  .btn svg { width: 16px; height: 16px; }
  .btn:disabled { pointer-events: none; opacity: .5; }

  /* Outline variant, icon size (Share, QR). */
  .icon-btn {
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center;
    border: 1px solid var(--input); background: var(--input-30);
    color: var(--foreground); box-shadow: var(--shadow-xs);
  }

  /* ---------- Label: fin's eyebrow step. The one recipe for every mono label. ---------- */
  .eyebrow, .flip-hint, .badge, .divider, .qr-heading {
    font-family: var(--font-mono); font-size: var(--text-eyebrow); font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
  }

  /* ---------- hero + flip ---------- */
  .hero { position: relative; width: 100%; height: 432px; overflow: hidden; }
  .hero-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 4; }
  .flip { position: absolute; inset: 0; perspective: 1500px; cursor: pointer; z-index: 1; }
  .flip-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform var(--duration-flip) var(--ease-flip);
  }
  .is-flipped .flip-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    /* Swap visibility at the edge-on point too: some WebKit builds let
       video bleed through backface-visibility. */
    transition: visibility 0s linear var(--delay-face-swap);
  }
  .face-back { transform: rotateY(180deg); visibility: hidden; }
  .is-flipped .face-front { visibility: hidden; }
  .is-flipped .face-back { visibility: visible; }

  .portrait-poster, .portrait-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 50%; display: block;
  }
  .portrait-video { opacity: 0; transition: opacity var(--duration-fade) ease; }
  .portrait-video.is-playing { opacity: 1; }
  .portrait-video::-webkit-media-controls-start-playback-button { display: none !important; -webkit-appearance: none; }

  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.13; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxODAnIGhlaWdodD0nMTgwJz48ZmlsdGVyIGlkPSduJz48ZmVUdXJidWxlbmNlIHR5cGU9J2ZyYWN0YWxOb2lzZScgYmFzZUZyZXF1ZW5jeT0nMC45JyBudW1PY3RhdmVzPScyJyBzdGl0Y2hUaWxlcz0nc3RpdGNoJy8+PC9maWx0ZXI+PHJlY3Qgd2lkdGg9JzEwMCUnIGhlaWdodD0nMTAwJScgZmlsdGVyPSd1cmwoI24pJy8+PC9zdmc+");
  }
  /* The clip fades into the card's own surface (--background) under the name. */
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, var(--background-0) 34%, var(--background-60) 60%, var(--background-90) 76%, var(--background) 100%);
  }
  .front-text { position: absolute; left: 26px; right: 26px; bottom: 22px; }
  .eyebrow { margin: 0 0 10px; color: var(--brand); }
  .name {
    margin: 0; font-family: var(--font-serif); font-weight: 700; font-size: var(--text-display); line-height: 1.08; letter-spacing: -0.025em;
    color: var(--foreground);
    text-shadow: 0 2px 18px rgb(0 0 0 / 0.5);   /* black transparency: legibility over the clip (Unit 01), not elevation */
  }

  /* "Tap" hint: button.tsx ghost variant, on the label recipe. */
  .flip-hint {
    position: absolute; bottom: 14px; right: 14px; z-index: 2;
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
    border: 1px solid transparent; background: none;
    color: var(--muted-foreground);
  }
  .flip-hint svg { width: 14px; height: 14px; }

  /* Back of the flip: fin's card surface, with the hairline that separates it from the card. */
  .face-back {
    background: var(--card); color: var(--foreground); border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: center; padding: 40px 32px 52px;
  }
  .back-logo { display: block; width: 140px; height: auto; margin: 0 0 24px; }
  .back-line {
    margin: 0 0 14px; font-family: var(--font-serif); font-weight: 700; font-size: var(--text-display-sm);
    line-height: 1.14; letter-spacing: -0.02em; text-wrap: balance;
  }
  .back-line .accent { color: var(--brand); }
  .back-body { font-size: var(--text-sm); line-height: 1.55; color: var(--muted-foreground); }

  /* ---------- content ---------- */
  .content { padding: 20px 26px 26px; }
  .role { margin: 0 0 16px; font-size: var(--text-sm); line-height: 1.5; color: var(--muted-foreground); }
  .role b { color: var(--foreground); font-weight: 600; }

  /* Badges: no fin equivalent. Fin's pill shape on its secondary surface, the label
     recipe, and the site's coral diamond as the marker. */
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px;
    color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--secondary);
  }
  .badge::before {
    content: ""; width: 6px; height: 6px; flex: none; transform: rotate(45deg); background: var(--brand);
  }

  /* Save: button.tsx default (primary) variant. Its disabled state is :not([href]): it stays
     clickable so the failure toast can still show (Unit 02, difference 5). */
  .save {
    width: 100%; height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 24px; border: 0; text-decoration: none;
    font-size: var(--text-base); font-weight: 500; color: var(--primary-foreground); background: var(--primary);
  }
  .save svg { flex: none; }
  .save:not([href]) { opacity: .5; cursor: default; }

  /* ---------- Card surface: fin's card (--card fill, --border hairline, radius-lg).
       The one recipe for link rows and quick-action tiles; their states are shared too. ---------- */
  .link, .quick a {
    border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--card);
    color: var(--foreground); text-decoration: none;
  }

  /* Quick-action tiles (off until P2). */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .quick[hidden] { display: none; }
  .quick a {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px;
    font-size: var(--text-xs); font-weight: 500;
  }
  .quick a svg { width: 18px; height: 18px; color: var(--brand); }

  .divider {
    display: flex; align-items: center; gap: 12px; margin: 24px 2px 14px;
    color: var(--muted-foreground);
  }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--border); }

  /* Link rows. */
  .links { display: flex; flex-direction: column; gap: 8px; }
  .link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .link-icon { width: 22px; height: 22px; flex: none; color: var(--brand); display: grid; place-items: center; }
  .link-icon svg { width: 20px; height: 20px; }
  .link-text { display: flex; flex-direction: column; gap: 2px; line-height: 1.25; }
  .link-name { font-size: var(--text-sm); font-weight: 500; }
  .link-sub { font-size: var(--text-xs); color: var(--muted-foreground); }
  .link-arrow { margin-left: auto; color: var(--muted-foreground); display: grid; transition: color var(--duration-fast); }
  .link-arrow svg { width: 16px; height: 16px; }

  .foot { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .foot img { display: block; width: 104px; height: auto; }
  .foot p { font-size: var(--text-eyebrow); letter-spacing: 0.04em; color: var(--muted-foreground); }

  /* ---------- states, in this order: hover → active → focus-visible → touch floor ---------- */

  /* hover: only where there is a pointer that hovers, so it never sticks after a tap */
  @media (hover: hover) {
    .icon-btn:hover { background: var(--input-50); }
    .flip-hint:hover { background: var(--accent-50); color: var(--foreground); }
    .save:hover { background: var(--primary-90); }
    .link:hover, .quick a:hover { background: var(--secondary); border-color: var(--accent); }
    .link:hover .link-arrow { color: var(--foreground); }
    .qr-close:hover { opacity: 1; }
  }

  /* active (pressed): everywhere, touch included. After hover, so a pressed control shows pressed. */
  .icon-btn:active { background: var(--muted); }
  .flip-hint:active { background: var(--accent); color: var(--foreground); }
  .save:active { background: var(--primary-80); }
  .link:active, .quick a:active { background: var(--muted); }
  .link:active { border-color: var(--accent); }
  /* Pressed: muted text would be 4.2:1 on --muted, so it lifts to linen. */
  .link:active .link-sub, .link:active .link-arrow { color: var(--foreground); }
  .qr-close:active { opacity: 1; background: var(--muted); }

  /* ---------- focus: fin's ring. --ring at full opacity, 3px, plus border-color. Never removed. ---------- */
  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .icon-btn:focus-visible, .flip-hint:focus-visible, .link:focus-visible, .quick a:focus-visible, .qr-close:focus-visible {
    border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring);
  }
  .qr-close:focus-visible { opacity: 1; }
  /* On the stone button a flush ring would merge into the fill; a 2px gap keeps it a ring. */
  .save:focus-visible { box-shadow: 0 0 0 2px var(--background), 0 0 0 5px var(--ring); }
  @media (forced-colors: active) {
    :focus-visible { outline: 2px solid; outline-offset: 2px; }
  }

  /* ---------- touch floor: fin §9.6, 44px where the pointer is a finger ---------- */
  @media (pointer: coarse) {
    .icon-btn { width: 44px; height: 44px; }
    .flip-hint { height: 44px; bottom: 8px; right: 8px; padding: 0 14px; }
    .qr-close { width: 44px; height: 44px; top: 8px; right: 8px; }
  }

  /* ---------- QR sheet: dialog.tsx (overlay, background surface, border, radius-lg, close) ---------- */
  .qr {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
    opacity: 0; visibility: hidden; transition: opacity var(--duration-fast), visibility 0s linear var(--duration-fast);
  }
  .qr.is-open { opacity: 1; visibility: visible; transition: opacity var(--duration-fast); }
  .qr-overlay { position: absolute; inset: 0; background: rgb(0 0 0 / 0.5); }   /* black/50: fin's dialog overlay */
  .qr-panel {
    position: relative; width: 100%; max-width: 22rem; display: flex; flex-direction: column; align-items: center;
    padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: var(--background); box-shadow: var(--shadow-lg);
    transform: scale(.95); transition: transform var(--duration-fast);
  }
  .qr.is-open .qr-panel { transform: none; }
  /* Close: dialog.tsx. Known defect (Unit 03, finding F1): this rule sits after the touch
     floor, so on touch it wins and Close stays 28px instead of 44px. Left as built pending Nate. */
  .qr-close {
    position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center; border: 1px solid transparent;
    background: none; color: var(--foreground); opacity: .7;
  }
  .qr-heading { margin: 4px 0 20px; color: var(--muted-foreground); }
  /* A light tile behind dark modules, so it still scans: linen under --background. */
  .qr-tile { padding: 14px; background: var(--foreground); color: var(--background); border-radius: var(--radius-md); }
  .qr-tile svg { display: block; width: 240px; height: 240px; }
  .qr-name { margin: 20px 0 0; font-family: var(--font-serif); font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.02em; color: var(--foreground); }
  .qr-caption { margin: 6px 0 0; font-size: var(--text-sm); color: var(--muted-foreground); text-align: center; }

  /* ---------- toast: fin's card surface ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 8px);
    max-width: 88vw; padding: 12px 16px; border-radius: var(--radius-lg); font-size: var(--text-sm); overflow-wrap: anywhere;
    background: var(--card); color: var(--foreground); border: 1px solid var(--border); box-shadow: var(--shadow-lg);
    opacity: 0; pointer-events: none; transition: opacity var(--duration-fast), transform var(--duration-fast);
  }
  .toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

  /* fin §8: reduced motion removes all of it, no exceptions. */
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { transition-duration: 0s !important; transition-delay: 0s !important; }
    .reveal { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="card">

    <!-- Portrait hero (flip card) -->
    <section class="hero reveal" id="hero">
      <div class="hero-actions">
        <button class="btn icon-btn" id="share-btn" type="button" aria-label="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
        <button class="btn icon-btn" id="qr-btn" type="button" aria-label="Show QR code" aria-haspopup="dialog" aria-controls="qr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h.01M17 21h4v-4"/></svg>
        </button>
      </div>

      <div class="flip" id="flip">
        <div class="flip-inner">
          <div class="face face-front" id="front">
            <img class="portrait-poster" id="poster" alt="" decoding="async">
            <video class="portrait-video" id="video" muted playsinline loop preload="none"
                   disablepictureinpicture disableremoteplayback aria-hidden="true" tabindex="-1"></video>
            <div class="grain"></div>
            <div class="shade"></div>
            <div class="front-text">
              <p class="eyebrow" id="eyebrow"></p>
              <h1 class="name" id="name"></h1>
            </div>
            <button class="btn flip-hint" id="flip-to-back" type="button" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg><span id="tap-label"></span>
            </button>
          </div>

          <div class="face face-back" id="back" inert aria-hidden="true">
            <img class="back-logo" id="back-logo" alt="">
            <p class="back-line" id="back-line"></p>
            <p class="back-body" id="back-body"></p>
            <button class="btn flip-hint" id="flip-to-front" type="button" aria-pressed="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg><span id="tap-back-label"></span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Content -->
    <div class="content" id="content">
      <p class="role reveal" id="role"></p>
      <div class="badges reveal" id="badges"></div>

      <a class="btn save reveal" id="save" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span id="save-label"></span>
      </a>

      <div class="quick reveal" id="quick" hidden></div>

      <p class="divider reveal" id="links-heading"></p>
      <nav class="links reveal" id="links" aria-labelledby="links-heading"></nav>

      <footer class="foot reveal">
        <img id="foot-logo" alt="">
        <p id="foot-text"></p>
      </footer>
    </div>
  </div>

  <!-- QR sheet (dialog) -->
  <div class="qr" id="qr-layer">
    <div class="qr-overlay" id="qr-overlay"></div>
    <div class="qr-panel" id="qr" role="dialog" aria-modal="true" aria-labelledby="qr-heading" aria-describedby="qr-caption">
      <button class="btn qr-close" id="qr-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <p class="qr-heading" id="qr-heading"></p>
      <div class="qr-tile" id="qr-tile"></div>
      <p class="qr-name" id="qr-name"></p>
      <p class="qr-caption" id="qr-caption"></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
(function () {
  "use strict";
  var C = window.CARD, L = C.labels;
  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  var ICONS = {
    website: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0 0-5ZM3 9h4v12H3V9Zm6 0h3.8v1.7h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 5.9V21h-4v-5.5c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9V21H9V9Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.2 2.5h3.3l-7.2 8.2 8.5 11.3h-6.7l-5.2-6.9-6 6.9H1.6l7.7-8.8L1 2.5h6.9l4.7 6.3 5.6-6.3Zm-1.2 17.8h1.8L7.1 4.3H5.2L17 20.3Z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.7-1.7C19.3 5.2 12 5.2 12 5.2s-7.3 0-8.9.4A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.7 1.7c1.6.4 8.9.4 8.9.4s7.3 0 8.9-.4a2.5 2.5 0 0 0 1.7-1.7C23 15.2 23 12 23 12Zm-13 3.2V8.8l5.5 3.2-5.5 3.2Z"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 3c.3 2.1 1.5 3.6 3.5 3.9v2.6c-1.3.1-2.5-.2-3.6-.8v5.7c0 3.4-2.6 5.9-5.8 5.6-2.7-.2-4.7-2.5-4.6-5.2.1-2.8 2.5-4.9 5.3-4.7v2.7c-.4-.1-.8-.1-1.2 0-1.1.3-1.8 1.3-1.6 2.4.2 1.1 1.2 1.8 2.3 1.6 1-.2 1.7-1.1 1.7-2.2V3h3.6Z"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
  };
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function icon(key) {
    var s = el("span");
    s.innerHTML = ICONS[key] || ICONS.website;
    return s;
  }
  function pageUrl() { return location.href.split("#")[0]; }

  // ---------- fill the card from CARD ----------
  $("name").textContent = C.displayName;
  $("qr-name").textContent = C.displayName;
  $("qr-heading").textContent = L.qrHeading;
  $("qr-caption").textContent = L.qrCaption;
  $("tap-label").textContent = L.tap;
  $("tap-back-label").textContent = L.tapBack;
  $("flip-to-back").setAttribute("aria-label", L.tap + " to flip the card");
  $("save-label").textContent = L.save;
  $("links-heading").textContent = L.linksHeading;

  var poster = $("poster");
  poster.src = C.media.poster;
  poster.alt = C.displayName;

  $("back-logo").src = C.back.logo;
  $("back-logo").alt = C.org;
  var backLine = $("back-line"), accent = C.back.lineAccent || "";
  var at = accent ? C.back.line.lastIndexOf(accent) : -1;
  if (at < 0) backLine.textContent = C.back.line;
  else backLine.append(C.back.line.slice(0, at), el("span", "accent", accent), C.back.line.slice(at + accent.length));
  $("back-body").textContent = C.back.body;

  var role = $("role");
  C.roleLine.forEach(function (part, i) {
    if (i === 0) role.appendChild(el("b", null, part));
    else role.appendChild(document.createTextNode(" · " + part));
  });

  C.badges.forEach(function (b) { $("badges").appendChild(el("span", "badge", b)); });
  if (!C.badges.length) $("badges").remove();

  var links = C.links.filter(function (l) { return l.url && l.url.trim(); });
  links.forEach(function (l) {
    var a = el("a", "link");
    a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    var ic = icon(l.icon); ic.className = "link-icon";
    var text = el("span", "link-text");
    text.appendChild(el("span", "link-name", l.name));
    if (l.sub) text.appendChild(el("span", "link-sub", l.sub));
    var arrow = el("span", "link-arrow"); arrow.innerHTML = ARROW;
    a.append(ic, text, arrow);
    $("links").appendChild(a);
  });
  if (!links.length) { $("links-heading").remove(); $("links").remove(); }

  // Quick-action tiles: only actions that resolve to a real target are shown.
  function resolveAction(key) {
    if (key === "call" && C.phone) return { ic: "phone", label: "Call", href: "tel:" + C.phone.replace(/\s/g, "") };
    if (key === "email" && C.email) return { ic: "mail", label: "Email", href: "mailto:" + C.email };
    var l = links.find(function (x) { return x.icon === key; });
    return l ? { ic: l.icon, label: l.name, href: l.url } : null;
  }
  var quick = (C.quickActions || []).map(resolveAction).filter(Boolean);
  quick.forEach(function (q) {
    var a = el("a"); a.href = q.href;
    if (/^https?:/.test(q.href)) { a.target = "_blank"; a.rel = "noopener"; }
    a.append(icon(q.ic), el("span", null, q.label));
    $("quick").appendChild(a);
  });
  if (quick.length) $("quick").hidden = false; else $("quick").remove();

  $("foot-logo").src = C.footer.logo;
  $("foot-logo").alt = C.org;
  $("foot-text").textContent = C.footer.text;

  // ---------- live local time ----------
  var timeFmt = new Intl.DateTimeFormat("en-US", { timeZone: C.place.timeZone, hour: "numeric", minute: "2-digit" });
  function tick() { $("eyebrow").textContent = C.place.label + " · " + timeFmt.format(new Date()); }
  tick();
  setInterval(tick, 15000);

  // ---------- hero video ----------
  var video = $("video"), flipped = false;
  video.muted = true;
  video.addEventListener("playing", function () { video.classList.add("is-playing"); });
  function playVideo() {
    if (reduceMotion.matches || flipped) return;
    if (!video.getAttribute("src")) { video.preload = "auto"; video.src = C.media.video; }
    var p = video.play();
    if (p && p.catch) p.catch(function () { /* autoplay blocked (e.g. Low Power Mode): poster stays */ });
  }
  function pauseVideo() { if (!video.paused) video.pause(); }
  function syncMotion() {
    if (reduceMotion.matches) { pauseVideo(); video.classList.remove("is-playing"); }
    else playVideo();
  }
  if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", syncMotion);
  syncMotion();

  // ---------- flip ----------
  var hero = $("hero"), front = $("front"), back = $("back");
  function setFlipped(next) {
    var hintFocused = document.activeElement && document.activeElement.classList.contains("flip-hint");
    flipped = next;
    hero.classList.toggle("is-flipped", flipped);
    front.inert = flipped; back.inert = !flipped;
    front.setAttribute("aria-hidden", String(flipped));
    back.setAttribute("aria-hidden", String(!flipped));
    if (flipped) pauseVideo(); else playVideo();
    if (hintFocused) {
      var target = flipped ? $("flip-to-front") : $("flip-to-back");
      setTimeout(function () { target.focus({ preventScroll: true }); }, reduceMotion.matches ? 0 : 120);
    }
  }
  $("flip").addEventListener("click", function () { setFlipped(!flipped); });

  // ---------- toast ----------
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("is-shown");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("is-shown"); }, 3200);
  }

  // ---------- share ----------
  function legacyCopy(text) {
    var ta = el("textarea"); ta.value = text;
    ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  }
  function copyLink(url) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(url).then(function () { toast(L.copied); }, function () {
        toast(legacyCopy(url) ? L.copied : url);
      });
    }
    toast(legacyCopy(url) ? L.copied : url);
  }
  $("share-btn").addEventListener("click", function () {
    var url = pageUrl();
    if (navigator.share) {
      navigator.share({ title: C.share.title, text: C.share.text, url: url }).catch(function (e) {
        if (!e || e.name !== "AbortError") copyLink(url); // AbortError = user closed the sheet
      });
    } else {
      copyLink(url);
    }
  });

  // ---------- QR ----------
  var qr = $("qr-layer"), content = $("content"), qrOpen = false;
  function qrSvg(text) {
    if (window.qrcode.stringToBytesFuncs) window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs["UTF-8"];
    var q = window.qrcode(0, "M");
    q.addData(text);
    q.make();
    var n = q.getModuleCount(), d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
    // 2-module margin inside the 14px linen tile ≈ the 4-module quiet zone scanners want.
    // Modules take the tile's text colour (--background).
    return '<svg viewBox="-2 -2 ' + (n + 4) + " " + (n + 4) + '" shape-rendering="crispEdges" role="img" aria-label="QR code linking to this page"><path fill="currentColor" d="' + d + '"/></svg>';
  }
  function setQR(open) {
    qrOpen = open;
    if (open) $("qr-tile").innerHTML = qrSvg(pageUrl());
    qr.classList.toggle("is-open", open);
    document.documentElement.classList.toggle("is-locked", open);
    hero.inert = open; content.inert = open;
    if (open) $("qr-close").focus({ preventScroll: true });
    else $("qr-btn").focus({ preventScroll: true });
  }
  $("qr-btn").addEventListener("click", function () { setQR(true); });
  $("qr-close").addEventListener("click", function () { setQR(false); });
  $("qr-overlay").addEventListener("click", function () { setQR(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && qrOpen) setQR(false); });

  // ---------- save contact (vCard 3.0) ----------
  function esc(v) { return String(v).replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;"); }
  function fold(line) {
    if (line.length <= 75) return line;
    var out = line.slice(0, 75), rest = line.slice(75);
    while (rest.length) { out += "\r\n " + rest.slice(0, 74); rest = rest.slice(74); }
    return out;
  }
  function buildVCard(photoB64) {
    var lines = [
      "BEGIN:VCARD", "VERSION:3.0",
      "N:" + esc(C.lastName) + ";" + esc(C.firstName) + ";;;",
      "FN:" + esc(C.firstName + " " + C.lastName)
    ];
    if (C.nickname) lines.push("NICKNAME:" + esc(C.nickname));
    if (C.org) lines.push("ORG:" + esc(C.org));
    if (C.title) lines.push("TITLE:" + esc(C.title));
    if (C.phone) lines.push("TEL;TYPE=CELL,VOICE:" + C.phone);
    if (C.email) lines.push("EMAIL;TYPE=INTERNET,WORK:" + C.email);
    links.forEach(function (l, i) {
      lines.push("item" + (i + 1) + ".URL:" + l.url);
      lines.push("item" + (i + 1) + ".X-ABLabel:" + esc(l.name));
    });
    if (photoB64) lines.push("PHOTO;ENCODING=b;TYPE=JPEG:" + photoB64);
    lines.push("END:VCARD");
    return lines.map(fold).join("\r\n") + "\r\n";
  }
  var save = $("save"), vcfUrl = null;
  function setVCard(photoB64) {
    var next = URL.createObjectURL(new Blob([buildVCard(photoB64)], { type: "text/vcard;charset=utf-8" }));
    if (vcfUrl) URL.revokeObjectURL(vcfUrl);
    vcfUrl = next;
    save.href = vcfUrl;
  }
  save.download = C.displayName + ".vcf";
  try { setVCard(null); } catch (e) { save.removeAttribute("href"); }
  save.addEventListener("click", function () {
    if (!save.getAttribute("href") || save.getAttribute("href") === "#") { toast(L.saveFailed); return; }
    setTimeout(function () { toast(L.saved); }, 300);
  });
  // Add the photo once it's here, so the tap itself stays a plain link click.
  fetch(C.media.contactPhoto)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(function (b) {
      return new Promise(function (res, rej) {
        var fr = new FileReader();
        fr.onload = function () { res(String(fr.result).split(",")[1]); };
        fr.onerror = rej;
        fr.readAsDataURL(b);
      });
    })
    .then(setVCard)
    .catch(function () { /* contact saves without a photo */ });
})();
</script>
</body>
</html>
